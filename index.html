<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solve or Boom</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  #wrap { position: relative; margin: 0 auto; }
  #wrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  /* Touch devices (src/touch.ts adds html.touch): the page is a fixed screen that never scrolls, zooms or opens a menu. */
  html.touch, html.touch body { position: fixed; inset: 0; width: 100%; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #touch { display: none; position: fixed; inset: 0; z-index: 5; pointer-events: none; font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; }
  #touch .tz { position: absolute; pointer-events: auto; touch-action: none; }
  #touch .tb { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center;
    border-radius: 50%; background: rgba(15,20,32,0.55); border: 2px solid rgba(255,255,255,0.6); color: #fff; font-weight: bold;
    pointer-events: auto; touch-action: none; }
  #touch .tb.fire { background: rgba(200,50,40,0.55); }
  #touch .tb.on { background: rgba(224,122,28,0.85); border-color: #fff3c4; }
  #touch .ring { position: absolute; box-sizing: border-box; border-radius: 50%; background: rgba(15,20,32,0.4); border: 2px solid rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #touch .knob { border-radius: 50%; background: rgba(255,255,255,0.55); border: 2px solid rgba(255,255,255,0.8); }
  /* Portrait on a touch device: the game is played sideways. */
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0c101c; color: #f2f5fb; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center; font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; }
  #rotate .phone { width: 44px; height: 76px; box-sizing: border-box; border: 4px solid #ffd06a; border-radius: 10px; animation: turn 2.4s ease-in-out infinite; }
  #rotate b { font-size: 26px; }
  #rotate span { font-size: 17px; color: #c8d2e6; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 70%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
  @media (orientation: portrait) { html.touch #rotate { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas><canvas id="game"></canvas></div>
<div id="touch"></div>
<div id="rotate"><div class="phone"></div><b>Gira el dispositivo</b><span>Solo se juega en horizontal.</span></div>
<input type="file" id="csv" accept=".csv,.txt,.tsv,text/csv" style="display:none">
<script type="module" src="./src/main.ts"></script>
</body>
</html>
